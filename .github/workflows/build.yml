name: "FAP: Build"

on:
  - push
  - pull_request

jobs:
  ufbt-build:
    runs-on: ubuntu-latest
    name: 'ufbt: Build'
    strategy:
      matrix:
        sdk-channel: [dev, release]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            uploads.github.com:443
            pypi.org:443
            files.pythonhosted.org:443
            update.flipperzero.one:443

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build
        uses: flipperdevices/flipperzero-ufbt-action@v0.1
        id: build
        with:
          sdk-channel: ${{ matrix.sdk-channel }}

      - name: Upload app artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-${{ steps.build.outputs.suffix }}-${{ matrix.sdk-channel }}
          path: ${{ steps.build.outputs.fap-artifacts }}
