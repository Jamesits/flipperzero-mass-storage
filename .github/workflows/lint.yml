name: "FAP: Lint"

on:
  - push
  - pull_request

jobs:
  ufbt-lint:
    runs-on: ubuntu-latest
    name: 'ufbt: Lint'
    strategy:
      matrix:
        sdk-channel: [dev, release]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            uploads.github.com:443
            pypi.org:443
            files.pythonhosted.org:443
            update.flipperzero.one:443

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Lint
        uses: flipperdevices/flipperzero-ufbt-action@v0.1
        with:
          sdk-channel: ${{ matrix.sdk-channel }}
          task: lint
